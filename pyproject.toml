[project]
name = "reporeader"
version = "0.1.0"
description = "Ask questions about any GitHub repository using RAG"
readme = "README.md"
authors = [
    { name = "JellyFishJuggler", email = "guptasrijan85@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gitpython>=3.2.1",
    "langchain-core>=1.6.12",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "transformers>=5.20.2",
]

[project.scripts]
reporeader = "reporeader:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
