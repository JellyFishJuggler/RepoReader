services:
  - type: web
    name: reporeader
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: EMBEDDINGS
        value: api
      - key: PRODUCTION
        value: "1"
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBED_DIMS
        value: "768"
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
